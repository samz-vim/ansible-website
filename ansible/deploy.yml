---
- name: Deploy website
  hosts: webservers
  become: true

  tasks:

    - name: Pull website image
      community.docker.docker_image:
        name: samzcode/terraform-website:latest
        source: pull

    - name: Remove old container
      community.docker.docker_container:
        name: ansible
        state: absent

    - name: Start website
      community.docker.docker_container:
        name: my-website
        image: samzcode/terraform-website:latest
        state: started
        restart_policy: always
        ports:
          - "80:80"
